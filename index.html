<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Supplement AI Lab</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf1fb;background:#0c1423}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.shell{max-width:720px;width:100%;background:#152238;border:1px solid #31435c;border-radius:22px;padding:28px;box-shadow:0 20px 70px #0005}h1{margin:0 0 8px;font-size:clamp(25px,5vw,38px)}.muted{color:#b4c4d9}label{display:block;margin:28px 0 9px;font-weight:650}input{width:100%;padding:15px;background:#0d192b;color:white;border:1px solid #52647b;border-radius:12px;font-size:17px}button{width:100%;background:#3275f6;color:white;border:0;padding:15px;margin-top:14px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#output{white-space:pre-wrap;line-height:1.7;background:#0e1a2d;border-radius:12px;padding:20px;margin-top:22px;display:none}small{display:block;margin-top:22px;color:#a7b9ce;line-height:1.6}</style></head><body><main class="shell"><h1>💊 Supplement AI Lab</h1><p class="muted">Learn about dietary supplements with Gemini AI.</p><form id="form"><label for="supplement">Supplement name</label><input id="supplement" placeholder="e.g. Vitamin D3" minlength="2" maxlength="80" required/><button id="analyze" type="submit">✨ Analyze Supplement</button></form><section id="output" aria-live="polite"></section><small>Educational content only. AI may make mistakes. Verify clinical claims with authoritative sources; not for individual treatment decisions.</small></main><script>const form=document.querySelector('#form'),out=document.querySelector('#output'),btn=document.querySelector('#analyze');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Analyzing…';out.style.display='block';out.textContent='Contacting Gemini securely…';try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supplement:document.querySelector('#supplement').value.trim()})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');out.textContent=data.result||'No response received.'}catch(err){out.textContent='Error: '+err.message}finally{btn.disabled=false;btn.textContent='✨ Analyze Supplement'}});</script></body></html>
